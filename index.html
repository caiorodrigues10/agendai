<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AGENDAI — Gestão para salões, barbearias e studios</title>
    <meta name="description" content="Fila digital, agenda e gestão para salões de beleza e barbearias — atendimento feminino, masculino e unissex." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Anti-flash: páginas públicas sempre dark. Com sessão, aplica tema salvo.
      (function () {
        var theme = 'dark';
        try {
          var hasSession = !!(
            localStorage.getItem('barber_access_token') ||
            localStorage.getItem('barber_refresh_token') ||
            localStorage.getItem('barber_user')
          );
          if (hasSession) {
            var saved = localStorage.getItem('agendai:theme') || localStorage.getItem('bq:theme');
            if (saved === 'light' || saved === 'dark') theme = saved;
          }
        } catch (e) { /* localStorage indisponível — mantém dark */ }
        var root = document.documentElement;
        root.classList.toggle('dark', theme === 'dark');
        root.style.colorScheme = theme;
        root.style.backgroundColor = theme === 'dark' ? '#0a0a0a' : '#f5f5f5';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__RECAPTCHA_SITE_KEY__ = '';
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
