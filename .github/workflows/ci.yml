name: CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      # Layout deliberado, nao estetico:
      #   $GITHUB_WORKSPACE/agendai      <- este repo
      #   $GITHUB_WORKSPACE/backend      <- repo irmao
      # e2e/post-editor.spec.ts importa '../../backend/src/...', relativo a
      # e2e/, ou seja: irmao da raiz do frontend. Com o frontend em
      # $GITHUB_WORKSPACE esse caminho apontaria para fora do runner; com o
      # frontend dentro de `agendai/` ele resolve. E e o mesmo layout do
      # monorepo local (agendai-projeto/{agendai,backend}).
      #
      # check-api-contract.mjs valida o backend no IMPORT (nao so no run), e o
      # default dele e `../backend` — tambem resolvido por este layout.
      API_CONTRACT_BACKEND: ${{ github.workspace }}/backend
    defaults:
      run:
        working-directory: ${{ github.workspace }}/agendai
    steps:
      - uses: actions/checkout@v4
        with:
          path: agendai
      - uses: actions/checkout@v4
        with:
          repository: caiorodrigues10/agendai-back-end
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: agendai/package-lock.json
      - run: npm ci
      - run: npm run docs:check
      - run: npm run test:contract
      - name: API contract against sibling backend
        run: npm run contract:check:strict
      - run: npm run typecheck
      - run: npm run lint:baseline
      # ANTES de `npm test`: o projeto `storybook` do vitest.config.ts abre
      # Chromium de verdade (browser.enabled + @vitest/browser-playwright).
      # Instalar depois reprovava com
      # "browserType.launch: Executable doesn't exist at
      #  .../chromium_headless_shell-1234/...".
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      # O projeto `webkit-iphone` (e2e/login-safari.spec.ts) precisa do WebKit
      # oficial instalado antes do passo de E2E.
      - run: npx playwright install --with-deps webkit
      # ITEM 4 — o e2e/google-auth.spec.ts NÃO tem test.skip: sem
      # VITE_GOOGLE_CLIENT_ID o botão Google não renderiza e o teste falha
      # ruidosamente. O Playwright faz o build no webServer (herda este env),
      # então a chave precisa estar AQUI, no step que roda o e2e.
      - name: E2E (chromium)
        env:
          # Id fictício do console do Google (o GIS é interceptado pelo spec,
          # nunca chega ao Google). Mesmo id do step webkit-iphone abaixo.
          VITE_GOOGLE_CLIENT_ID: 000000000000-e2e-fake.apps.googleusercontent.com
        run: npm run test:e2e
      # ITEM 2 — o projeto webkit-iphone (login-safari.spec.ts) só roda com
      # VITE_RECAPTCHA_SITE_KEY no build (senão o test.skip dispara e o job
      # ficaria verde sem provar nada). Step dedicado: roda os 3 testes no
      # WebKit oficial (Ubuntu) e FALHA se qualquer um skippar.
      - name: E2E WebKit/iPhone (não pode skippar)
        env:
          # Chave de teste pública do Google reCAPTCHA (documentada em
          # developers.google.com/recaptcha/docs/faq) — não é segredo.
          VITE_RECAPTCHA_SITE_KEY: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
          # O botão "Entrar com Google" só renderiza com VITE_GOOGLE_CLIENT_ID
          # (src/pages/LoginPage.tsx). O script do GIS é interceptado pelo
          # spec, então este id fictício nunca chega ao Google.
          VITE_GOOGLE_CLIENT_ID: 000000000000-e2e-fake.apps.googleusercontent.com
        run: |
          set -o pipefail
          npm run build
          npx playwright test --project=webkit-iphone --reporter=line 2>&1 | tee /tmp/webkit-e2e.log
          if grep -qE '[1-9][0-9]* skipped' /tmp/webkit-e2e.log; then
            echo '::error::webkit-iphone skippou — test.skip ativo (VITE_RECAPTCHA_SITE_KEY ausente no build?)'
            exit 1
          fi
