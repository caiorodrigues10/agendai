name: CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      # Layout deliberado, nao estetico:
      #   $GITHUB_WORKSPACE/agendai      <- este repo
      #   $GITHUB_WORKSPACE/backend      <- repo irmao
      # e2e/post-editor.spec.ts importa '../../backend/src/...', relativo a
      # e2e/, ou seja: irmao da raiz do frontend. Com o frontend em
      # $GITHUB_WORKSPACE esse caminho apontaria para fora do runner; com o
      # frontend dentro de `agendai/` ele resolve. E e o mesmo layout do
      # monorepo local (agendai-projeto/{agendai,backend}).
      #
      # check-api-contract.mjs valida o backend no IMPORT (nao so no run), e o
      # default dele e `../backend` — tambem resolvido por este layout.
      API_CONTRACT_BACKEND: ${{ github.workspace }}/backend
    defaults:
      run:
        working-directory: ${{ github.workspace }}/agendai
    steps:
      - uses: actions/checkout@v4
        with:
          path: agendai
      - uses: actions/checkout@v4
        with:
          repository: caiorodrigues10/agendai-back-end
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: agendai/package-lock.json
      - run: npm ci
      - run: npm run docs:check
      - run: npm run test:contract
      - name: API contract against sibling backend
        run: npm run contract:check:strict
      - run: npm run typecheck
      - run: npm run lint:baseline
      # ANTES de `npm test`: o projeto `storybook` do vitest.config.ts abre
      # Chromium de verdade (browser.enabled + @vitest/browser-playwright).
      # Instalar depois reprovava com
      # "browserType.launch: Executable doesn't exist at
      #  .../chromium_headless_shell-1234/...".
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
