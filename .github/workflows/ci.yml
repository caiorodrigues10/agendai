name: CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      # check-api-contract.mjs resolve o backend no IMPORT (nao so no run), e o
      # default e `../backend` — fora do workspace no Actions. Apontar para o
      # checkout irmago cobre tanto test:contract quanto contract:check:strict.
      API_CONTRACT_BACKEND: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: caiorodrigues10/agendai-back-end
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run docs:check
      - run: npm run test:contract
      - name: API contract against sibling backend
        run: npm run contract:check:strict
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 482
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
